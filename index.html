<script>
/* ============================== storage ============================== */
/* One record in IndexedDB so we're not near the ~5MB localStorage cap.
   localStorage is the fallback if IndexedDB is unavailable. */
const DB='deficit', STORE='kv', KEY='state';
let _db=null;
function openDB(){
  return new Promise(res=>{
    if(!window.indexedDB) return res(null);
    const r=indexedDB.open(DB,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>res(null);
  });
}
async function loadState(){
  _db=await openDB();
  if(_db){
    const v=await new Promise(res=>{
      const t=_db.transaction(STORE,'readonly').objectStore(STORE).get(KEY);
      t.onsuccess=()=>res(t.result); t.onerror=()=>res(null);
    });
    if(v) return v;
  }
  try{const s=localStorage.getItem(KEY); if(s) return JSON.parse(s);}catch(e){}
  return null;
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{
      if(_db) _db.transaction(STORE,'readwrite').objectStore(STORE).put(S,KEY);
      else localStorage.setItem(KEY,JSON.stringify(S));
    }catch(e){console.error('save failed',e);}
  },180);
}

/* ============================== model ============================== */
const DEFAULTS={
  settings:{cal:2200,protein:170,carbs:200,fat:70,lb:190,heightIn:71,eatBack:75,lastBackup:0,fdcKey:'',lastVerse:-1},
  /* body: kept in the model so old backups restore cleanly and a future
     weight / body-fat screen has somewhere to write. No UI reads it now. */
  foods:[], logs:{}, ex:{}, body:{}
};
let S=JSON.parse(JSON.stringify(DEFAULTS));
let tab='today', date=todayStr(), sheet=null;

function todayStr(d){d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function shift(s,n){const[y,m,d]=s.split('-').map(Number);return todayStr(new Date(y,m-1,d+n));}
function pretty(s){
  if(s===todayStr())return 'Today';
  if(s===shift(todayStr(),-1))return 'Yesterday';
  const[y,m,d]=s.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
}
const uid=()=>Math.random().toString(36).slice(2,10);
const nm=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
const r0=n=>Math.round(n);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=n=>Math.round(n*10)/10;

/* Units that read wrong when pluralized: "24 count", not "24 counts". */
const NOPLURAL=new Set(['g','kg','mg','oz','lb','ml','l','fl','tbsp','tsp','count','each','pkg','ct']);
const OES=new Set(['potato','tomato','mango','hero']);
const fmtNum=n=>String(Math.round(n*100)/100);

/* "1 large egg (50 g)" at 3 servings reads as "3 large eggs (150 g)".
   Every number in the string scales; the last word before any parenthesis
   gets an s unless it's a unit abbreviation. No number to scale means we
   fall back to "3 x whatever". */
function scaleServing(serving,qty){
  const q=nm(qty);
  let s=String(serving||'').trim()||'1 serving';
  if(!q||q===1)return s;
  let found=false;
  let out=s.replace(/(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)/g,(m,a,b,c)=>{
    found=true;
    return fmtNum((a!==undefined?parseFloat(a)/parseFloat(b):parseFloat(c))*q);
  });
  if(!found)return fmtNum(q)+' \u00d7 '+s;
  return out.replace(/^([^(,]*)/,head=>{
    const m=head.match(/^(.*?)([A-Za-z]+)(\s*)$/);
    if(!m)return head;
    const w=m[2];
    /* leave alone: already plural, a unit, or a participle like "cooked" */
    if(/(s|ed)$/i.test(w)||NOPLURAL.has(w.toLowerCase()))return head;
    const plural=/[^aeiou]y$/i.test(w)?w.slice(0,-1)+'ies':
                 (/(ch|sh|x|z)$/i.test(w)||OES.has(w.toLowerCase()))?w+'es':w+'s';
    return m[1]+plural+m[3];
  });
}

/* Net METs (MET - 1): resting burn is already inside the base target. */
const ACTS=[
 ['Walking','Walking, moderate 3.0 mph',3.5],['Walking','Walking, brisk 4.0 mph',5.0],
 ['Walking','Hiking, cross country',6.0],['Walking','Stair climber',9.0],
 ['Running','Running, 12 min/mile',8.3],['Running','Running, 10 min/mile',9.8],
 ['Running','Running, 8 min/mile',11.8],
 ['Gym','Weights, general effort',3.5],['Gym','Weights, vigorous effort',6.0],
 ['Gym','Circuit training, vigorous',8.0],['Gym','Elliptical, moderate',5.0],
 ['Gym','Rowing machine, moderate',7.0],['Gym','Stationary bike, moderate',7.0],
 ['Gym','Yoga, hatha',2.5],
 ['Outdoor','Cycling, 12 to 14 mph',8.0],['Outdoor','Cycling, 14 to 16 mph',10.0],
 ['Outdoor','Swimming laps, moderate',5.8],['Outdoor','Fishing, wading in stream',6.0],
 ['Outdoor','Golf, walking with clubs',4.3],['Outdoor','Yard work, mowing',5.0],
 ['Sport','Basketball, general',6.5],['Sport','Tennis, singles',8.0]
];
const burnFor=(met,mins)=>r0(Math.max(met-1,0)*(nm(S.settings.lb)*0.4536)*(nm(mins)/60));

const logOf=d=>S.logs[d]||[];
const exOf=d=>S.ex[d]||{watch:'',items:[]};
function totalsOf(d){
  return logOf(d).reduce((a,e)=>({cal:a.cal+e.cal*e.qty,p:a.p+e.p*e.qty,
    c:a.c+e.c*e.qty,f:a.f+e.f*e.qty}),{cal:0,p:0,c:0,f:0});
}
function rawBurn(d){
  const x=exOf(d);
  if(String(x.watch).trim()!=='') return nm(x.watch);
  return x.items.reduce((a,i)=>a+i.cal,0);
}
const credited=d=>r0(rawBurn(d)*(nm(S.settings.eatBack)/100));
const ceilingOf=d=>nm(S.settings.cal)+credited(d);

/* A day counts when protein target is met AND the calorie ceiling held. */
function dayHit(d){
  const l=logOf(d); if(!l.length) return false;
  const t=totalsOf(d);
  return t.p>=nm(S.settings.protein) && t.cal<=ceilingOf(d);
}
function dayLogged(d){return logOf(d).length>0;}

function streakInfo(){
  const t=todayStr();
  let cur=0,cursor=dayHit(t)?t:shift(t,-1);
  while(dayHit(cursor)){cur++;cursor=shift(cursor,-1);}
  const hits=Object.keys(S.logs).filter(dayHit).sort();
  let best=0,run=0,prev=null;
  hits.forEach(k=>{run=(prev&&shift(prev,1)===k)?run+1:1;if(run>best)best=run;prev=k;});
  const win=n=>{let h=0;for(let i=0;i<n;i++){if(dayHit(shift(t,-i)))h++;}return h;};
  const recent=[];for(let i=6;i>=0;i--){const d=shift(t,-i);
    recent.push({d,hit:dayHit(d),logged:dayLogged(d)});}
  return {cur,best,w:win(7),m:win(30),recent};
}

/* ============================== splash ============================== */
/* Shown on launch. iOS keeps a home screen web app alive in the background,
   so a return after this long counts as a fresh open. */
const SPLASH_GAP=60*60e3;
let lastSeen=Date.now(), lastDay=todayStr();

function pickVerse(){
  const last=S.settings.lastVerse;
  let i=Math.floor(Math.random()*VERSES.length);
  /* never the same verse twice running */
  if(VERSES.length>1&&i===last)i=(i+1)%VERSES.length;
  S.settings.lastVerse=i;save();
  return VERSES[i];
}
function showSplash(){
  const v=pickVerse(), n=v.t.length;
  const size=n<90?30:n<150?26:n<240?22:n<340?19:17;
  document.body.style.overflow='hidden';
  document.querySelector('#splash').innerHTML=`
    <div class="splash" data-act="dismiss">
      <div class="splash-mark">Deficit</div>
      <div class="verse" style="font-size:${size}px">${esc(v.t)}</div>
      <div class="ref">${esc(v.r)}</div>
      <div class="tap">Tap to begin</div>
    </div>`;
}
function hideSplash(){
  const el=document.querySelector('.splash');
  if(!el)return;
  el.classList.add('out');
  document.body.style.overflow='';
  setTimeout(()=>{document.querySelector('#splash').innerHTML='';},280);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){lastSeen=Date.now();lastDay=todayStr();return;}
  const away=Date.now()-lastSeen;
  /* Mid-task is not a fresh open. Re-rendering would wipe a half-typed food
     and kill a running camera, so leave an open sheet alone entirely. */
  if(sheet){lastSeen=Date.now();return;}
  if(todayStr()!==lastDay){date=todayStr();render();}
  if(away>SPLASH_GAP)showSplash();
});

}

function qtyMacroText(f,qty){
  const q=nm(qty);
  return `${r0(f.cal*q)} cal \u00b7 P ${r1(f.p*q)} \u00b7 C ${r1(f.c*q)} \u00b7 F ${r1(f.f*q)}`;
}
function macroLine(serving,cal,p,c,f,qty){
  const q=nm(qty)||1, v=[nm(cal),nm(p),nm(c),nm(f)];
  if(!v.some(n=>n))return '';
  return `${scaleServing(serving,q)} \u00b7 ${r0(v[0]*q)} cal \u00b7 P ${r1(v[1]*q)} \u00b7 C ${r1(v[2]*q)} \u00b7 F ${r1(v[3]*q)}`;
}
function newPreviewText(){const f=sh.form;return macroLine(f.serving,f.cal,f.p,f.c,f.f,sh.qty);}
function updateNewPreview(){

/* ---- Open Food Facts ---- */
async function lookup(code){
  sh.status='Looking up '+code+'\u2026';render();
  try{
    const url='https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+
      '.json?fields=product_name,brands,serving_size,nutriments';
    const r=await fetch(url);
    const j=await r.json();
    /* A missing barcode still returns HTTP 200, so check the body. */
    if(j.status!==1||!j.product){
      sh.status='Not in the database. Add it under New and it saves for next time.';render();return;
    }
    const p=j.product, n=p.nutriments||{};
    const per=k=>n[k+'_serving'];
    const hundred=k=>n[k+'_100g'];
    const hasServing=per('energy-kcal')!=null||per('proteins')!=null;
    const g=k=>hasServing?nm(per(k)):nm(hundred(k));
    const name=[p.brands?String(p.brands).split(',')[0].trim():'',p.product_name].filter(Boolean).join(' ');
    sh.form={
      name:name||('Barcode '+code),
      serving:hasServing?(p.serving_size||'1 serving'):'100 g',
      cal:r0(g('energy-kcal')),p:Math.round(g('proteins')*10)/10,
      c:Math.round(g('carbohydrates')*10)/10,f:Math.round(g('fat')*10)/10,
      barcode:code
    };
    sh.mode='new';sh.status='';
    stopScanner();
    render();
    const warn=hasServing?'':'These numbers are per 100 g, not per serving. Adjust before saving.';
    if(warn){const el=document.querySelector('#n_serving');if(el)el.focus();alert(warn);}
  }catch(e){
    sh.status='Lookup failed. Check your connection, or type the numbers under New.';render();
  }
}

/* ---- USDA FoodData Central ---- */
const FDC='https://api.nal.usda.gov/fdc/v1';
const fdcKey=()=>String(S.settings.fdcKey||'').trim()||'DEMO_KEY';
const portionCache={};

/* Search results and the detail endpoint return nutrients in different
   shapes, so flatten both to one id-keyed map. Non-branded FDC values are
   always per 100 g. */
function per100(food){
  const map={};
  (food.foodNutrients||[]).forEach(n=>{
    const id=n.nutrientId||(n.nutrient&&n.nutrient.id);
    const val=n.value!=null?n.value:n.amount;
    if(id!=null&&val!=null)map[id]=nm(val);
  });
  const g=k=>map[k]!=null?map[k]:null;
  const p=g(1003)||0,f=g(1004)||0,c=g(1005)||0;
  /* 1008 is kcal; Foundation foods sometimes only carry Atwater or kJ. */
  let cal=g(1008);
  if(cal==null)cal=g(2047);
  if(cal==null)cal=g(2048);
  if(cal==null&&g(1062)!=null)cal=g(1062)/4.184;
  if(cal==null)cal=p*4+c*4+f*9;
  return {cal,p,c,f};
}

const servingText=(label,grams)=>/\d\s*g$/i.test(label)?label:
  `${label} (${fmtNum(grams>=10?Math.round(grams):Math.round(grams*10)/10)} g)`;

/* FNDDS puts the readable text in portionDescription; SR Legacy puts it in
   modifier with an "undetermined" measure unit. */
function portionLabel(p){
  const desc=String(p.portionDescription||'').trim();
  if(desc&&!/^quantity not specified$/i.test(desc))return desc;
  const amt=nm(p.amount)||1;
  const unit=p.measureUnit&&p.measureUnit.name&&p.measureUnit.name!=='undetermined'?p.measureUnit.name:'';
  const mod=String(p.modifier||'').trim();
  const txt=[fmtNum(amt),unit,/^\d+$/.test(mod)?'':mod].filter(Boolean).join(' ').trim();
  return /[a-z]/i.test(txt)?txt:'';
}

async function fdcSearch(q){
  if(!q.trim())return;
  sh.status='Searching\u2026';sh.results=[];sh.open=null;sh.portions=null;render();
  try{
    const url=FDC+'/foods/search?api_key='+encodeURIComponent(fdcKey())
      +'&query='+encodeURIComponent(q)+'&pageSize=25'
      +'&dataType='+encodeURIComponent('Foundation,SR Legacy,Survey (FNDDS)');
    const r=await fetch(url);
    if(r.status===429){sh.status='USDA rate limit reached. Add your own free key under Setup to raise it.';render();return;}
    if(r.status===403){sh.status='USDA rejected that key. Check it under Setup.';render();return;}
    if(!r.ok){sh.status='USDA search failed ('+r.status+'). Try again shortly.';render();return;}
    const j=await r.json();
    sh.results=(j.foods||[]).map(x=>({id:String(x.fdcId),name:String(x.description||'').trim(),
      per100:per100(x)})).filter(x=>x.name&&x.per100.cal>0);
    sh.status=sh.results.length?'':'Nothing matched. Try one or two plain words, like "pistachio" or "apple raw".';
    render();
  }catch(e){
    sh.status='Could not reach USDA. Check your connection, or type it under New.';render();
  }
}

async function fdcOpen(id){
  if(sh.open===id){sh.open=null;sh.portions=null;render();return;}
  sh.open=id;sh.portions=portionCache[id]||null;sh.status='';render();
  if(sh.portions)return;
  const base=[{label:'1 oz',grams:28.35},{label:'100 g',grams:100}];
  try{
    const r=await fetch(FDC+'/food/'+encodeURIComponent(id)+'?api_key='+encodeURIComponent(fdcKey()));
    const j=r.ok?await r.json():{};
    const list=[],seen={};
    (j.foodPortions||[]).forEach(p=>{
      const gw=nm(p.gramWeight), label=portionLabel(p);
      if(!gw||!label||seen[label.toLowerCase()])return;
      seen[label.toLowerCase()]=1;list.push({label,grams:gw});
    });
    const full=list.concat(base);
    portionCache[id]=full;
    if(sh.open===id){sh.portions=full;render();}
  }catch(e){
    if(sh.open===id){sh.portions=base;render();}
  }
}

/* Hand the chosen portion to the New form, where the name stays editable and
   the servings stepper already does live math. */
function useFdc(food,label,grams){
  const k=grams/100;
  sh.form={name:food.name,serving:servingText(label,grams),
    cal:r0(food.per100.cal*k),p:r1(food.per100.p*k),
    c:r1(food.per100.c*k),f:r1(food.per100.f*k)};
  sh.qty='1';sh.keep=true;sh.mode='new';sh.status='';render();
}

/* ---- scanner ---- */
let scanner=null;
function loadScript(src){return new Promise((res,rej)=>{
  const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

async function startScanner(){
  if(sh.scanning)return;
  sh.scanning=true;
  sh.status='Starting camera\u2026';render();
  try{
    if(!window.Html5Qrcode) await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
    const F=window.Html5QrcodeSupportedFormats;
    scanner=new window.Html5Qrcode('reader',{
      formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128],
      experimentalFeatures:{useBarCodeDetectorIfSupported:true},
      verbose:false
    });
    await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:160}},
      code=>{if(!sh.scanning)return;sh.scanning=false;lookup(code);},
      ()=>{});
    sh.status='Point at the barcode.';render();
  }catch(e){
    sh.scanning=false;
    sh.status='Camera unavailable. Type the barcode below instead.';render();
  }
}
function stopScanner(){
  sh.scanning=false;
  if(scanner){try{scanner.stop().then(()=>{try{scanner.clear();}catch(e){}scanner=null;}).catch(()=>{scanner=null;});}
  catch(e){scanner=null;}}
}

/* ============================== events ============================== */
document.addEventListener('click',e=>{
  if(e.target.closest('.splash')){hideSplash();return;}
  const nav=e.target.closest('nav button');
  if(nav){tab=nav.dataset.tab;stopScanner();sheet=null;render();return;}
  const el=e.target.closest('[data-act]');
  if(!el)return;
  const a=el.dataset.act;

  if(a==='closebg'&&e.target.closest('[data-stop]'))return;
  if(a==='close'||a==='closebg'){sheet=null;stopScanner();render();return;}

  if(a==='day'){const n=+el.dataset.n;if(n>0&&date>=todayStr())return;date=shift(date,n);render();return;}
  if(a==='del'){setLog(date,logOf(date).filter(x=>x.id!==el.dataset.id));render();return;}
  if(a==='delfood'){S.foods=S.foods.filter(x=>x.id!==el.dataset.id);save();render();return;}

  if(a==='add'){sheet='add';sh={...sh,mode:'saved',q:'',sel:null,qty:'1',form:{},keep:true,
    meal:el.dataset.meal,status:'',fq:'',results:[],open:null,portions:null};render();return;}
  if(a==='mode'){
    const m=el.dataset.m;
    if(sh.mode==='scan'&&m!=='scan')stopScanner();
    sh.mode=m;sh.status='';render();
    if(m==='scan')startScanner();
    return;}
  if(a==='pick'){
    /* Taps inside the open servings row must not fold the card shut. */
    if(e.target.closest('[data-keepopen]'))return;
    const id=el.dataset.id;
    if(sh.sel===id)sh.sel=null; else {sh.sel=id;sh.qty='1';}
    render();return;}
  if(a==='qstep'){
    let q=nm(sh.qty);
    q=q?Math.round((q+(+el.dataset.n))*100)/100:1;
    if(q<0.5)q=0.5;
    sh.qty=String(q);
    const box=document.querySelector('#qty')||document.querySelector('#n_qty');
    if(box)box.value=sh.qty;
    updateQtyPreview();updateNewPreview();return;}
  if(a==='addsel'){
    const f=S.foods.find(x=>x.id===el.dataset.id);
    if(f){f.last=Date.now();addEntry(f,sh.qty,sh.meal,false);}
    return;}
  if(a==='addnew'){
    const v=id=>{const n=document.querySelector(id);return n?n.value:'';};
    const name=v('#n_name').trim();
    if(!name){alert('Give the food a name first.');return;}
    addEntry({name,serving:v('#n_serving'),cal:v('#n_cal'),p:v('#n_p'),c:v('#n_c'),f:v('#n_f'),
      barcode:sh.form.barcode||null}, v('#n_qty'), sh.meal, document.querySelector('#n_keep').checked);
    return;}
  if(a==='lookupmanual'){
    const c=document.querySelector('#manualcode').value.trim();
    if(c)lookup(c);
    return;}

  if(a==='fdcgo'){
    const el2=document.querySelector('#fdq');
    if(el2)sh.fq=el2.value;
    fdcSearch(sh.fq);return;}
  if(a==='fdcpick'){
    if(e.target.closest('[data-keepopen]'))return;
    fdcOpen(el.dataset.id);return;}
  if(a==='fdcuse'){
    const food=sh.results.find(x=>x.id===sh.open), p=sh.portions[+el.dataset.i];
    if(food&&p)useFdc(food,p.label,p.grams);
    return;}
  if(a==='fdccustom'){
    const food=sh.results.find(x=>x.id===sh.open);
    const amt=nm(document.querySelector('#fdcamt').value);
    const unit=document.querySelector('#fdcunit').value;
    if(!food||!amt)return;
    useFdc(food,fmtNum(amt)+' '+unit,unit==='oz'?amt*28.3495:amt);
    return;}

  if(a==='exopen'){sheet='ex';render();return;}
  if(a==='savewatch'){
    const x={...exOf(date),watch:document.querySelector('#watchval').value.trim()};
    S.ex[date]=x;save();render();return;}
  if(a==='addact'){
    const sel=document.querySelector('#actsel');
    const mins=document.querySelector('#actmin').value;
    const met=nm(sel.value), name=sel.options[sel.selectedIndex].text;
    if(!nm(mins))return;
    const x=exOf(date);
    S.ex[date]={...x,items:[...x.items,{id:uid(),name,mins:nm(mins),cal:burnFor(met,mins)}]};
    save();render();return;}
  if(a==='delact'){
    const x=exOf(date);
    S.ex[date]={...x,items:x.items.filter(i=>i.id!==el.dataset.id)};save();render();return;}

  if(a==='savesettings'){
    const v=id=>nm(document.querySelector(id).value);
    Object.assign(S.settings,{protein:v('#s_protein'),cal:v('#s_cal'),carbs:v('#s_carbs'),
      fat:v('#s_fat'),lb:v('#s_lb'),heightIn:v('#s_h'),eatBack:v('#s_eat')});
    save();render();return;}

  if(a==='calc'){
    const sex=document.querySelector('#c_sex').value;
    const age=nm(document.querySelector('#c_age').value);
    const act=parseFloat(document.querySelector('#c_act').value);
    const cut=nm(document.querySelector('#c_cut').value);
    const lb=nm(S.settings.lb), inch=nm(S.settings.heightIn);
    if(!age||!lb||!inch){document.querySelector('#calcout').innerHTML=
      `<div class="note" style="margin-top:12px">Fill in age above, plus weight and height in the targets card.</div>`;return;}
    const kg=lb*0.4536, cm=inch*2.54;
    const bmr=10*kg+6.25*cm-5*age+(sex==='m'?5:-161);
    const base=bmr*act, target=base-cut;
    const protein=lb*0.9, fat=target*0.25/9, carbs=(target-protein*4-fat*9)/4;
    document.querySelector('#calcout').innerHTML=`<div class="note" style="margin-top:12px">
      Rest-day maintenance is around <b>${r0(base)}</b>.
      <div class="mono" style="font-size:15px;font-weight:600;margin:8px 0">
        ${r0(target)} cal &middot; P ${r0(protein)} &middot; C ${r0(Math.max(carbs,0))} &middot; F ${r0(fat)}</div>
      <button class="btn sm" data-act="usecalc" data-v="${r0(target)},${r0(protein)},${r0(Math.max(carbs,0))},${r0(fat)}">Use these</button>
    </div>`;
    return;}
  if(a==='usecalc'){
    const [cal,p,c,f]=el.dataset.v.split(',').map(Number);
    Object.assign(S.settings,{cal,protein:p,carbs:c,fat:f});save();render();return;}

  if(a==='savekey'){
    S.settings.fdcKey=document.querySelector('#s_fdc').value.trim();
    save();render();return;}

  if(a==='io'){sheet='io';render();return;}
  if(a==='doimport'){
    const box=document.querySelector('#pastebox'), note=document.querySelector('#ionote');
    let arr;try{arr=JSON.parse(box.value);}catch(err){note.textContent='That is not valid JSON. Paste the block exactly, brackets included.';return;}
    if(!Array.isArray(arr)){note.textContent='Expected a list in square brackets.';return;}
    let added=0,updated=0;
    arr.filter(x=>x&&x.name).forEach(x=>{
      const i=S.foods.findIndex(y=>y.name.toLowerCase()===String(x.name).toLowerCase());
      const rec={id:i>=0?S.foods[i].id:uid(),name:String(x.name).trim(),
        serving:String(x.serving||'1 serving'),cal:nm(x.cal),p:nm(x.p),c:nm(x.c),f:nm(x.f),
        barcode:x.barcode||null,last:i>=0?S.foods[i].last:0};
      if(i>=0){S.foods[i]=rec;updated++;}else{S.foods.push(rec);added++;}
    });
    save();note.textContent=`Added ${added}, updated ${updated}.`;box.value='';return;}
  if(a==='showlist'){
    document.querySelector('#pastebox').value=JSON.stringify(
      S.foods.map(({name,serving,cal,p,c,f})=>({name,serving,cal,p,c,f})),null,1);
    document.querySelector('#ionote').textContent='Copy this somewhere safe.';return;}

  if(a==='export'){exportData();return;}
  if(a==='importfile'){document.querySelector('#restore').click();return;}
});

document.addEventListener('change',e=>{
  if(e.target.id==='restore'){
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result);
        if(!d.settings||!d.foods)throw new Error('shape');
        if(!confirm('Replace everything in this app with the backup file?'))return;
        S={...DEFAULTS,...d};save();render();
      }catch(err){alert('That file does not look like a Deficit backup.');}
    };
    rd.readAsText(f);
  }
});

document.addEventListener('keydown',e=>{
  if(e.target.id==='fdq'&&e.key==='Enter'){e.preventDefault();sh.fq=e.target.value;fdcSearch(sh.fq);}
});

/* live-typing inputs update state without a full re-render */
document.addEventListener('input',e=>{
  if(e.target.id==='fq'){foodQuery=e.target.value;
    const scroll=window.scrollY;render();window.scrollTo(0,scroll);
    const el=document.querySelector('#fq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}
  if(e.target.id==='sq'){sh.q=e.target.value;
    render();const el=document.querySelector('#sq');
    if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}}
  if(e.target.id==='fdq')sh.fq=e.target.value;
  if(e.target.id==='qty'){sh.qty=e.target.value;updateQtyPreview();}
  if(e.target.id==='n_qty')sh.qty=e.target.value;
  if(/^n_/.test(e.target.id||''))updateNewPreview();
});

/* ============================== boot ============================== */
(async function(){
  const loaded=await loadState();
  if(loaded)S={...DEFAULTS,...loaded,settings:{...DEFAULTS.settings,...(loaded.settings||{})}};

  /* Shortcuts hand off today's active energy as ?burn=NNN */
  const q=new URLSearchParams(location.search);
  if(q.has('burn')){
    const v=q.get('burn').replace(/[^\d.]/g,'');
    if(v){S.ex[todayStr()]={...exOf(todayStr()),watch:v};save();}
    history.replaceState({},'',location.pathname);
  }
  render();
  showSplash();
})();
</script>
</body>
